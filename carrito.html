<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - Rosquilla Reyes</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/style-nuevas.css">
    <link rel="stylesheet" href="css/carrito.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div id="header-placeholder"></div>

    <section class="nueva-seccion">
        <h2 class="titulo-seccion">Tu Carrito de Compras</h2>

        <!-- Carrito vacío -->
        <div id="carrito-vacio" class="carrito-vacio">
            <i class='bx bx-cart'></i>
            <p>Tu carrito está vacío</p>
            <a href="productos.html" class="btn">Ver productos <i class='bx bxs-right-arrow'></i></a> 
        </div>

        <!-- Carrito con productos -->
        <div id="carrito-lleno">
            <table class="carrito-table">
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Cantidad</th>
                        <th>Precio</th>
                        <th>Subtotal</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="carrito-body">
                    <!-- Se llena dinámicamente -->
                </tbody>
            </table>
            
            <div class="carrito-total">
                <p>Total a pagar: <span id="carrito-total-valor">C$ 0.00</span></p>
                <br>
                <a href="forma-pago.html" class="btn">Proceder al Pago <i class='bx bx-check'></i></a>
            </div>
        </div>
    </section>

    <div id="footer-placeholder"></div>
    <script src="js/components.js"></script>
    <script src="js/productos-data.js"></script>
    <script src="js/carrito-page.js"></script>
</body>
</html>
