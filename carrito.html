<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - Rosquilla Reyes</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/style-nuevas.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div id="header-placeholder"></div>

    <section class="nueva-seccion">
        <h2 class="titulo-seccion">Tu Carrito de Compras</h2>
        <table class="carrito-table">
            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Cantidad</th>
                    <th>Precio</th>
                    <th>Subtotal</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Rosquillas</td>
                    <td>2</td>
                    <td>C$ 120.00</td>
                    <td>C$ 240.00</td>
                    <td><a href="#" style="color: red;"><i class='bx bx-trash'></i></a></td>
                </tr>
                <tr>
                    <td>Hojaldras</td>
                    <td>1</td>
                    <td>C$ 150.00</td>
                    <td>C$ 150.00</td>
                    <td><a href="#" style="color: red;"><i class='bx bx-trash'></i></a></td>
                </tr>
            </tbody>
        </table>
        
        <div class="carrito-total">
            <p>Total a pagar: <span style="color: var(--main-color);">C$ 390.00</span></p>
            <br>
            <a href="forma-pago.html" class="btn">Proceder al Pago</a>
        </div>
    </section>

    <div id="footer-placeholder"></div>
    <script src="js/components.js"></script> 
</body>
</html>
