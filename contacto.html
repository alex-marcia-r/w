<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Rosquilla Reyes</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/stylec.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>

<body>
    <!-- Header -->
    <div id="header-placeholder"></div>

    <!-- Hero Contacto -->
    <section class="page-hero">
        <p class="form-tag">CONTÁCTENOS</p>
        <h1 class="page-title">Envíenos sus consultas<span>!</span></h1>
    </section>

    <!-- Contenido contacto -->
    <section class="contacto-section">
        <!-- Formulario (izquierda) -->
        <div class="contacto-form-wrap">
            <form class="contacto-form">
                <h5>Formulario de contacto</h3> <br>
                    <h2>ENVIENOS SUS CONSULTAS</h2> <br><br>
                    <input type="text" placeholder="Tu nombre" required>
                    <input type="tel" placeholder="Tu número">
                    <input type="text" placeholder="Asunto">
                    <textarea placeholder="Mensaje" rows="4" required></textarea>
                    <button type="submit" class="btn">Enviar mensaje</button>
            </form>
        </div>

        <!-- Info (derecha) -->
        <div class="contacto-info">
            <h3>Visítenos</h3>
            <div class="info-card">
                <i class="bx bx-map"></i>
                <div>
                    <strong>Dirección</strong>
                    <p>De la estación de policía 2 cuadras al Sur, El Viejo, Nicaragua</p>
                </div>
            </div>
            <div class="info-card">
                <i class="bx bx-phone"></i>
                <div>
                    <strong>Contacto</strong>
                    <p>+505 8250 1265<br>+505 2344 0258</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <div id="footer-placeholder"></div>
    <script src="js/components.js"></script> 
    <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>
</body>
</html>
