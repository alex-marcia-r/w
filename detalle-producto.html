<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Producto - Rosquilla Reyes</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/style-nuevas.css">
    <link rel="stylesheet" href="css/detalle-producto.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div id="header-placeholder"></div>

    <section class="nueva-seccion">
        <div class="detalle-grid">
            <div class="detalle-img">
                <img id="det-img" src="img/rosquillas.jpg" alt="Producto">
            </div>
            <div class="detalle-info">
                <h2 id="det-titulo">Cargando producto...</h2>
                <p id="det-precio" class="precio">C$ 0.00</p>
                <p id="det-desc">
                    Por favor espera...
                </p>

                <!-- Selector de cantidad -->
                <div class="cantidad-selector">
                    <label>Cantidad:</label>
                    <button class="btn-qty" id="btn-menos"><i class='bx bx-minus'></i></button>
                    <span class="cantidad-valor" id="det-cantidad">1</span>
                    <button class="btn-qty" id="btn-mas"><i class='bx bx-plus'></i></button>
                </div>

                <a href="#" class="btn" id="btn-agregar-carrito">
                    <span class="btn-texto">Añadir al carrito</span> <i class='bx bx-cart-add'></i>
                </a>
            </div>
        </div>
    </section>

    <div id="footer-placeholder"></div>
    <script src="js/components.js"></script>
    <script src="js/productos-data.js"></script>
    <script src="js/detalle-producto.js"></script>
</body>
</html>
