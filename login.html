<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Rosquilla Reyes</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/style-nuevas.css">
    <link rel="stylesheet" href="css/login.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div id="header-placeholder"></div>

    <section class="nueva-seccion">
        <div class="login-wrap">
            <h2 class="titulo-seccion">Iniciar Sesión</h2>
            <form class="login-form" action="index.html">
                <input type="email" placeholder="Correo electrónico" required>
                <input type="password" placeholder="Contraseña" required>
                <button type="submit" class="btn">Entrar</button>
                <p>
                    ¿No tienes cuenta? <a class="res" href="#">Regístrate</a>
                </p>
            </form>
        </div>
    </section>

    <div id="footer-placeholder"></div>
    <script src="js/components.js"></script>
</body>
</html>
