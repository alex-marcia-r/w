<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Rosquilla Reyes</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/stylep.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>

<body>
    <!-- Header -->
    <div id="header-placeholder"></div>

    <!-- Hero productos -->
    <section class="page-hero">
        <div class="page-hero-card">
            <h1>EXPLORA NUESTRO CATÁLOGO</h1>
        </div>
        <p class="hero-sub">Si desea de nuestros productos para eventos, no dude en llamarnos,
            para más información en <a href="contacto.html" class="link-contacto">Contacto</a></p>
    </section>

    <!-- Productos principales -->
    <section class="productos-grid">
        <div class="producto-card">
            <div class="producto-img-wrap">
                <img src="img/rosquillas.jpg" alt="Rosquillas">
            </div>
            <p>Rosquillas</p>
        </div>

        <div class="producto-card">
            <div class="producto-img-wrap">
                <img src="img/hojaldras.jpg" alt="Hojaldras">
            </div>
            <p>Hojaldras</p>
        </div>

        <div class="producto-card">
            <div class="producto-img-wrap">
                <img src="img/rosquetes.jpg" alt="Rosquetes">
            </div>
            <p>Rosquetes</p>
        </div>

        <div class="producto-card">
            <div class="producto-img-wrap">
                <img src="img/cosadehorno.jpg" alt="Cosas de horno">
            </div>
            <p>Cosas de horno</p>
        </div>
    </section>

    <!-- Exclusiva para eventos -->
    <section class="eventos-section">
        <h2 class="eventos-title">Exclusiva para eventos</h2>
        <div class="productos-grid">
            <div class="producto-card">
                <div class="producto-img-wrap">
                    <img src="img/pupusas.jpg" alt="Pupusas Tostadas">
                </div>
                <p>Pupusas Tostadas</p>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <div id="footer-placeholder"></div>

    <!-- documento de javascript para funcionalidades de las paginas -->
    <script src="js/components.js"></script> 
    <!-- enlace de un paquete de javascript para usar iconos -->
    <script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>
</body>

</html>
